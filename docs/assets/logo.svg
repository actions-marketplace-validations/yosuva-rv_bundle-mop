<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Bundle Mop logo: a mop sweeping away JavaScript chunks</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a55f"/>
      <stop offset="1" stop-color="#127a43"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- handle -->
  <line x1="184" y1="40" x2="104" y2="140" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- mop head -->
  <rect x="62" y="136" width="84" height="22" rx="9" fill="#ffffff"/>
  <!-- strands, flicking right as it sweeps -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M70 158 Q66 182 62 204"/>
    <path d="M86 158 Q84 184 82 208"/>
    <path d="M102 158 Q103 184 104 208"/>
    <path d="M118 158 Q122 183 126 205"/>
    <path d="M134 158 Q141 180 148 200"/>
  </g>
  <!-- chunks being swept away -->
  <rect x="164" y="182" width="26" height="26" rx="6" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="198" y="168" width="20" height="20" rx="5" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="222" y="190" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.4"/>
</svg>
