name: Release

# Push a tag like v0.1.2 (scripts/release.mjs creates it) and this workflow:
# checks it, publishes the CLI to npm with provenance (trusted publishing, no token),
# moves the major tag (v0) and creates the GitHub release from CHANGELOG.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # move the major tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need origin/main to check the tag is on it
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency cache in release builds

      - name: Check tag, version, changelog and branch
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./packages/cli/package.json').version")
          [ "$VERSION" = "$PKG" ] || { echo "::error::Tag $TAG does not match packages/cli/package.json version $PKG"; exit 1; }
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION (date)' entry"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not a commit on main"; exit 1; }
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('::error::npm '+process.argv[1]+' is too old for trusted publishing (need 11.5.1+)'); process.exit(1) }" "$(npm --version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundled action is up to date
        run: git diff --exit-code -- packages/action/dist || { echo "::error::packages/action/dist is stale in $GITHUB_REF_NAME"; exit 1; }

      - name: Publish to npm
        working-directory: packages/cli
        run: |
          if npm view "bundle-mop@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "bundle-mop@${{ steps.meta.outputs.version }} is already on npm; skipping (re-run)."
          else
            # Checks and build ran above, so skip prepublishOnly.
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: Move ${{ steps.meta.outputs.major }} to this release
        run: |
          git tag -f "${{ steps.meta.outputs.major }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.meta.outputs.major }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo '---'
            echo
            echo "**npm:** \`npm i -D bundle-mop@$VERSION\` ([bundle-mop on npm](https://www.npmjs.com/package/bundle-mop/v/$VERSION))"
            echo
            echo "**Action:** \`uses: yosuva-rv/bundle-mop@${{ steps.meta.outputs.major }}\` (or pin \`@$GITHUB_REF_NAME\`)"
          } >> notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
